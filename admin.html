<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>更新ページ</title>
<style>
:root{--bg:#fff7fb;--ink:#3a2440;--sub:#7d6586;--line:#ecd3e2;--accent:#b04a7e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1422;--ink:#f6e9f1;--sub:#bba2c4;--line:#4a3353;--accent:#e58ab6;--card:#251a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}h1{font-size:22px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
label{display:block;margin:8px 0 2px;font-weight:700;font-size:13px}
input,textarea,select{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px}button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}button.d{color:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.blk{border:2px dashed var(--line);border-radius:12px;padding:10px;margin:10px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#msg{font-size:13px;color:var(--sub)}img.pv{max-width:160px;max-height:100px;border-radius:8px;display:block;margin-top:6px}small{color:var(--sub)}
</style></head><body><main>
<h1>更新ページ</h1>
<details class="card" id="cfgBox"><summary><b>GitHubとつなぐ（最初に1回だけ）</b></summary>
<small>トークンは、このブラウザの中だけに保存されます。リポジトリ1つだけに「Contents: Read and write」を許可した、細かい権限のトークンを作ってください。</small>
<label>ユーザー名</label><input data-c="owner" placeholder="例：yourname">
<label>リポジトリ名</label><input data-c="repo" placeholder="例：yourname.github.io">
<label>ブランチ</label><input data-c="branch" placeholder="main">
<label>トークン</label><input data-c="token" type="password" autocomplete="off">
<div class="row"><button class="p" id="cfgSave">保存して読み込む</button></div></details>
<div id="ed"></div>
</main>
<div class="bar"><span id="msg">読み込み中…</span><button id="dl">data.jsonを保存</button><button class="p" id="pub">公開する（GitHubに保存）</button></div>
<script>
const $=id=>document.getElementById(id);
let D={site:{links:[]},works:[]},sha=null,pending={},prev={},cfg={};
try{cfg=JSON.parse(localStorage.getItem('pfcfg')||'{}')}catch{}
const msg=t=>$('msg').textContent=t;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>{const b=new TextEncoder().encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const api=(p,o={})=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`+(o.method?'':`?ref=${cfg.branch||'main'}`),{...o,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
const get=(o,path)=>path.split('.').reduce((a,k)=>a&&a[k],o);
const set=(o,path,v)=>{const ks=path.split('.');const l=ks.pop();get(o,ks.join('.')||'')&&0;ks.reduce((a,k)=>a[k],o)[l]=v};
const imgSrc=p=>prev[p]||p;

function render(){
  const s=D.site;
  let h=`<div class="card"><h2>サイト全体</h2>
  <label>サイトの名前</label><input data-k="site.name" value="${esc(s.name)}">
  <label>ひとこと紹介</label><input data-k="site.intro" value="${esc(s.intro)}">
  <label>支援バーの文</label><input data-k="site.supportText" value="${esc(s.supportText)}">
  <label>支援ページのURL（空ならバーは出ません）</label><input data-k="site.supportUrl" value="${esc(s.supportUrl)}">
  <label>リンク（GitHub・BOOTH・フリームなど）</label>`;
  (s.links||[]).forEach((l,i)=>h+=`<div class="row"><input style="width:35%" data-k="site.links.${i}.label" value="${esc(l.label)}" placeholder="名前"><input style="width:55%" data-k="site.links.${i}.url" value="${esc(l.url)}" placeholder="https://..."><button class="d" data-a="rmlink" data-i="${i}">×</button></div>`);
  h+=`<div class="row"><button data-a="addlink">＋リンクを足す</button></div>
  <label>このページについて（空行で段落が分かれます）</label><textarea data-k="site.about">${esc(s.about)}</textarea></div><h2>作品</h2>`;
  D.works.forEach((w,i)=>{
    const k=`works.${i}.`;
    h+=`<details class="card" ${w.title?'':'open'}><summary><b>${esc(w.title||'（名前なし）')}</b> <small>${{public:'公開',draft:'公開準備中',hidden:'非表示'}[w.status]||''}</small></summary>
    <label>タイトル</label><input data-k="${k}title" value="${esc(w.title)}">
    <label>状態</label><select data-k="${k}status">${[['public','公開'],['draft','公開準備中'],['hidden','非表示']].map(([v,t])=>`<option value="${v}" ${w.status===v?'selected':''}>${t}</option>`).join('')}</select>
    <label>リンク先URL（タイトルを押すと開きます。「公開」のときだけ有効）</label><input data-k="${k}url" value="${esc(w.url)}" placeholder="https://...">
    <label>サムネ画像</label>${w.thumb?`<img class="pv" src="${esc(imgSrc(w.thumb))}" alt="">`:''}<input type="file" accept="image/*" data-img="${k}thumb">
    <label>タグ（カンマ区切り）</label><input data-k="${k}tags" data-tags="1" value="${esc((w.tags||[]).join(', '))}">
    <label>紹介（段落ごとに足せます）</label>`;
    (w.blocks||[]).forEach((b,j)=>{const bk=`${k}blocks.${j}.`;
      h+=`<div class="blk"><b>${{text:'文章',image:'画像',youtube:'YouTube動画',link:'ボタンリンク'}[b.type]}</b>`;
      if(b.type==='text')h+=`<textarea data-k="${bk}text" placeholder="空行で段落、**太字**、[文字](URL)">${esc(b.text)}</textarea>`;
      if(b.type==='image')h+=(b.src?`<img class="pv" src="${esc(imgSrc(b.src))}" alt="">`:'')+`<input type="file" accept="image/*" data-img="${bk}src"><input data-k="${bk}caption" value="${esc(b.caption)}" placeholder="説明（任意）">`;
      if(b.type==='youtube')h+=`<input data-k="${bk}url" value="${esc(b.url)}" placeholder="YouTubeのURL">`;
      if(b.type==='link')h+=`<input data-k="${bk}label" value="${esc(b.label)}" placeholder="ボタンの文字"><input data-k="${bk}url" value="${esc(b.url)}" placeholder="https://...">`;
      h+=`<div class="row"><button data-a="bup" data-i="${i}" data-j="${j}">↑</button><button data-a="bdown" data-i="${i}" data-j="${j}">↓</button><button class="d" data-a="bdel" data-i="${i}" data-j="${j}">削除</button></div></div>`});
    h+=`<div class="row">${[['text','＋文章'],['image','＋画像'],['youtube','＋YouTube'],['link','＋ボタン']].map(([t,n])=>`<button data-a="badd" data-t="${t}" data-i="${i}">${n}</button>`).join('')}</div>
    <div class="row"><button data-a="wup" data-i="${i}">作品を上へ</button><button data-a="wdown" data-i="${i}">下へ</button><button class="d" data-a="wdel" data-i="${i}">この作品を削除</button></div></details>`});
  $('ed').innerHTML=h+`<div class="row"><button class="p" data-a="wadd">＋作品を足す</button></div>`;
}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;set(D,k,t.dataset.tags?t.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean):t.value)});
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset.img||!t.files[0])return;
  const img=await createImageBitmap(t.files[0]);const sc=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const du=c.toDataURL('image/jpeg',.85),p=`images/${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.jpg`;
  pending[p]=du.split(',')[1];prev[p]=du;set(D,t.dataset.img,p);render()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!t.dataset.a)return;const a=t.dataset.a,i=+t.dataset.i,j=+t.dataset.j,w=D.works[i];
  if(a==='addlink')D.site.links.push({label:'',url:''});
  else if(a==='rmlink')D.site.links.splice(i,1);
  else if(a==='wadd')D.works.push({id:'w'+Date.now().toString(36),title:'',status:'draft',url:'',thumb:'',tags:[],blocks:[]});
  else if(a==='wdel'){if(!confirm('この作品を削除しますか？'))return;D.works.splice(i,1)}
  else if(a==='wup')mv(D.works,i,-1);else if(a==='wdown')mv(D.works,i,1);
  else if(a==='badd')w.blocks.push({type:t.dataset.t});
  else if(a==='bdel')w.blocks.splice(j,1);else if(a==='bup')mv(w.blocks,j,-1);else if(a==='bdown')mv(w.blocks,j,1);
  render()});
document.querySelectorAll('[data-c]').forEach(i=>{i.value=cfg[i.dataset.c]||''});
$('cfgSave').onclick=()=>{document.querySelectorAll('[data-c]').forEach(i=>cfg[i.dataset.c]=i.value.trim());try{localStorage.setItem('pfcfg',JSON.stringify(cfg))}catch{}load()};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='data.json';a.click()};
async function load(){
  try{
    if(cfg.owner&&cfg.repo&&cfg.token){const r=await api('data.json');if(r.status===404){msg('data.jsonがまだありません。公開すると作られます');render();return}if(!r.ok)throw new Error('GitHubにつながりません（'+r.status+'）。トークンと名前を確認してください');const j=await r.json();sha=j.sha;D=JSON.parse(dec(j.content));$('cfgBox').open=false;msg('読み込みました')}
    else{const r=await fetch('data.json');D=await r.json();msg('GitHubとつなぐと、ここから公開できます');$('cfgBox').open=true}
  }catch(err){msg(err.message)}
  D.site=D.site||{};D.site.links=D.site.links||[];D.works=D.works||[];render();
}
$('pub').onclick=async()=>{
  if(!(cfg.owner&&cfg.repo&&cfg.token))return msg('先に「GitHubとつなぐ」を入力してください');
  try{
    const json=JSON.stringify(D,null,2);
    for(const p of Object.keys(pending)){if(!json.includes(p))continue;msg('画像を保存中… '+p);
      const r=await api(p,{method:'PUT',body:JSON.stringify({message:'画像を追加',content:pending[p],branch:cfg.branch||'main'})});if(!r.ok)throw new Error('画像の保存に失敗（'+r.status+'）');delete pending[p]}
    msg('内容を保存中…');
    const body={message:'ページを更新',content:enc(json),branch:cfg.branch||'main'};if(sha)body.sha=sha;
    const r=await api('data.json',{method:'PUT',body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status===409||r.status===422?'別の場所で更新されています。読み込み直してからやり直してください':'保存に失敗（'+r.status+'）');
    sha=(await r.json()).content.sha;msg('公開しました。反映まで1〜2分かかります');
  }catch(err){msg(err.message)}};
load();
</script></body></html>
