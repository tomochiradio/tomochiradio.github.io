<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作物まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--ink:#3a2440;--sub:#7d6586;--line:#ecd3e2;--accent:#b04a7e;--on:#fff;--soft:#f6e6ef;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1422;--ink:#f6e9f1;--sub:#bba2c4;--line:#4a3353;--accent:#e58ab6;--on:#2a1630;--soft:#2b1d33;--card:#251a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
a{color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.support{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--on);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:14px}
.support a{background:var(--on);color:var(--accent);text-decoration:none;padding:6px 16px;border-radius:999px;font-weight:900}
main{max-width:880px;margin:0 auto;padding:0 20px 80px}
.hero{padding:52px 0 24px}.hero h1{margin:0;font-size:clamp(30px,6vw,46px);line-height:1.25;font-weight:900}.hero p{margin:12px 0 0;color:var(--sub)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0;padding:0;list-style:none}
.links a{display:inline-block;padding:8px 18px;border:2px solid var(--line);border-radius:999px;text-decoration:none;font-weight:700;background:var(--card)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
h2{font-size:22px;margin:40px 0 16px;font-weight:900}
.work{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:22px}
.work .thumb img{display:block;width:100%;max-height:340px;object-fit:cover}
.work .body{padding:22px 26px}
.work h3{margin:0;font-size:24px;font-weight:900;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.work h3 a{text-decoration:none}.work h3 a:hover{color:var(--accent);text-decoration:underline}
.badge{font-size:12px;font-weight:700;border:2px dashed var(--line);color:var(--sub);padding:0 10px;border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:0;list-style:none}.tags li{font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 10px;border-radius:999px}
.work p{margin:.5em 0}.work p a,.about p a{color:var(--accent)}.work figure{margin:14px 0}.work figure img{max-width:100%;border-radius:14px}
.work figcaption{font-size:13px;color:var(--sub)}.video{position:relative;aspect-ratio:16/9;margin:14px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px}
.btn{display:inline-block;margin:8px 8px 0 0;padding:7px 18px;border-radius:999px;background:var(--accent);color:var(--on)!important;font-weight:700;text-decoration:none}
.about{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 26px}footer{margin-top:40px;color:var(--sub);font-size:13px}
</style></head><body>
<div class="support" id="support" hidden></div>
<main>
<section class="hero"><h1 id="name">制作物まとめ</h1><p id="intro"></p><ul class="links" id="links"></ul></section>
<h2>作ったもの</h2><div id="works">読み込み中…</div>
<h2>このページについて</h2><div class="about" id="about"></div>
<footer>3Dモデルの一部は Picoberry の無料プランで生成したもので、CC BY 4.0 のライセンスです。</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https?:\/\//i.test(u)||/^images\/[\w.\-]+$/.test(u)?esc(u):'';
const md=t=>esc(t).split(/\n{2,}/).filter(p=>p.trim()).map(p=>'<p>'+p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br>')+'</p>').join('');
const yt=u=>(String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const block=b=>{
  if(b.type==='text')return md(b.text);
  if(b.type==='image'&&url(b.src))return `<figure><img src="${url(b.src)}" alt="${esc(b.caption)}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;
  if(b.type==='youtube'&&yt(b.url))return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yt(b.url)}" title="動画" allowfullscreen loading="lazy"></iframe></div>`;
  if(b.type==='link'&&url(b.url))return `<a class="btn" href="${url(b.url)}" target="_blank" rel="noopener noreferrer">${esc(b.label||'リンク')}</a>`;
  return '';};
const ext='target="_blank" rel="noopener noreferrer"';
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  const s=d.site||{};
  if(s.name){$('name').textContent=s.name;document.title=s.name+'｜制作物まとめ'}
  $('intro').textContent=s.intro||'';
  if(s.supportUrl){const b=$('support');b.hidden=false;b.innerHTML=`<span>${esc(s.supportText)}</span><a href="${url(s.supportUrl)}" ${ext}>支援する</a>`}
  $('links').innerHTML=(s.links||[]).filter(l=>url(l.url)).map(l=>`<li><a href="${url(l.url)}" ${ext}>${esc(l.label)}</a></li>`).join('');
  $('about').innerHTML=md(s.about||'');
  const ws=(d.works||[]).filter(w=>w.status!=='hidden');
  $('works').innerHTML=ws.map(w=>{
    const live=w.status==='public'&&url(w.url);
    const title=live?`<a href="${url(w.url)}" ${ext}>${esc(w.title)}</a>`:esc(w.title);
    const th=w.thumb&&url(w.thumb)?(live?`<a class="thumb" href="${url(w.url)}" ${ext} tabindex="-1" aria-hidden="true">`:'<div class="thumb">')+`<img src="${url(w.thumb)}" alt="" loading="lazy">`+(live?'</a>':'</div>'):'';
    return `<article class="work">${th}<div class="body"><h3>${title}${w.status==='public'?'':'<span class="badge">公開準備中</span>'}</h3><ul class="tags">${(w.tags||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${(w.blocks||[]).map(block).join('')}</div></article>`}).join('')||'<p>まだ作品がありません。</p>';
}).catch(()=>{$('works').textContent='データを読み込めませんでした。'});
</script></body></html>
